[env:esp32s3_xiaozhi]
; Waveshare ESP32-S3-Touch-LCD-2.8 (Xiaozhi Type C form factor).
;   ESP32-S3R8, 8 MB OPI PSRAM, 4 MB flash, ILI9341V 240x320, FT6336G touch.
; PSRAM is REQUIRED — splash canvas + double LVGL buffers go there.
; (Some Xiaozhi batches ship 4 MB QSPI flash — see board chip-id before
; assuming 16 MB. huge_app.csv leaves ~3 MB for the app.)
; ES3C28P panel uses ILI9341V driver (per user sticker inspection), NOT
; the ST7789 listed on Waveshare wiki — many ES3C28P batches ship with
; ILI9341 even though the wiki says ST7789.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv
upload_speed = 921600
monitor_speed = 115200

build_src_filter =
    +<*>
    -<boards/>
    +<boards/esp32s3_xiaozhi/>

build_flags =
    -DBOARD_XIAOZHI
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; Panels per Waveshare wiki: ESP32-S3-Touch-LCD-2.8 ships ST7789.
    -DCYD_LCD_ILI9341_TYPE2
    ; NimBLE — same config as AMOLED boards
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DCONFIG_BT_NIMBLE_ATT_PREPARE_WRITE_COUNT=32
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=8
    ; LVGL
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.4
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.1


